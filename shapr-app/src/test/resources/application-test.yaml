spring:
  application:
    name: shapr-test
  
  datasource:
    url: jdbc:h2:mem:shapr-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: WARN
    br.com.firstsoft.shapr: INFO

